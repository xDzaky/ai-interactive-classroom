name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Laravel API Tests
  # ─────────────────────────────────────────────
  api-tests:
    name: Laravel API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests (PHPUnit — SQLite in-memory)
        run: php artisan test --parallel

  # ─────────────────────────────────────────────
  # 2. TypeScript packages build
  # ─────────────────────────────────────────────
  packages-build:
    name: TypeScript Packages Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/**' build

      - name: Typecheck packages
        run: pnpm -r --filter './packages/**' typecheck

  # ─────────────────────────────────────────────
  # 3. React Web Build + Tests
  # ─────────────────────────────────────────────
  web-tests:
    name: React Web Build + Tests
    runs-on: ubuntu-latest
    needs: packages-build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages first
        run: pnpm -r --filter './packages/**' build

      - name: Typecheck web
        run: pnpm --filter @ai-classroom/web typecheck

      - name: Run web tests
        run: pnpm --filter @ai-classroom/web test:run

      - name: Build web
        run: pnpm --filter @ai-classroom/web build

  # ─────────────────────────────────────────────
  # 4. FastAPI AI Service Tests
  # ─────────────────────────────────────────────
  ai-service-tests:
    name: FastAPI AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest -v --tb=short
